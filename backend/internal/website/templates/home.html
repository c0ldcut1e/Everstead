{{template "header" .}}
<h1>Everstead</h1>
{{if .Account}}
    <p>You are signed in as <strong>{{.Account.Username}}</strong>.</p>
    <p><a class="button" href="/account">Your account</a></p>
{{else}}
    <p>
        <a class="button" href="/register">Create an account</a>
        <a class="button secondary" href="/login">Sign in</a>
    </p>
{{end}}
<section class="download" id="download">
    <div>
        <p class="eyebrow">GET STARTED</p>
        <h2>Download the launcher</h2>
        <p class="muted">Choose your platform.</p>
    </div>
    <div class="download-options">
        <a class="download-option" href="/static/downloads/EversteadLauncher-windows-x86-64.zip" download>
            <span class="platform-icon" aria-hidden="true">⊞</span>
            <span><strong>Windows</strong><small>x86-64</small></span>
            <span aria-hidden="true">↓</span>
        </a>
        <a class="download-option" href="/static/downloads/EversteadLauncher-linux-x86-64.tar.zst" download>
            <span class="platform-icon" aria-hidden="true">◆</span>
            <span><strong>Linux</strong><small>x86-64</small></span>
            <span aria-hidden="true">↓</span>
        </a>
        <a class="download-option" href="/static/downloads/EversteadLauncher-linux-arm64.tar.zst" download>
            <span class="platform-icon" aria-hidden="true">◆</span>
            <span><strong>Linux</strong><small>ARM64</small></span>
            <span aria-hidden="true">↓</span>
        </a>
    </div>
</section>
{{template "footer" .}}
